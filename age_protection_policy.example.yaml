# Age Protection Policy: configuration sample for engineering and simulation only.
# NOT legal thresholds. Must be validated with actual data and compliance sign-off.
policy_id: age-protection
policy_version: age-v1-draft
mode: shadow             # shadow | enforce; deployment promotion requires review
jurisdiction: DEFAULT    # use jurisdiction-specific approved overrides
source_of_age: verified_kyc_only
business_timezone: configured_from_jurisdiction
feb_29_non_leap_birthday: march_1
unknown_age_profile: UNKNOWN
bands:
  - { name: STANDARD, min_age: 18, max_age: 59 }
  - { name: AWARENESS, min_age: 60, max_age: 64 }
  - { name: ENHANCED, min_age: 65, max_age: 69 }
  - { name: ENHANCED_PLUS, min_age: 70, max_age: 79 }
  - { name: ASSISTED, min_age: 80, max_age: null }
# Separate minor eligibility from elder protection; do not infer that all minors may transact.
under_18: defer_to_existing_account_eligibility_policy
objective_signal_groups:
  - beneficiary_change
  - unusual_outflow
  - transaction_velocity
  - account_security_change
  - beneficiary_verification_mismatch
  - confirmed_external_fraud_intelligence
  - balance_drain
# Correlated signals inside a group may NOT be double-counted as distinct evidence.
interventions:
  contextual_warning:
    min_age: 60
    requires_non_age_signal_count: 1
    action: education_only
  early_step_up:
    min_age: 65
    requires_independent_signal_group_count: 2
    requires_core_action: WARN
    action: STEP_UP
    max_action_from_age_policy: STEP_UP
  independent_verification_offer:
    min_age: 70
    requires_non_age_signal_count: 1
    action: offer_only
  assisted_protection_offer:
    min_age: 80
    requires_non_age_signal_count: 0
    action: optional_accessible_assistance
forbidden_age_only_actions:
  - HOLD_REVIEW
  - BLOCK
  - FREEZE_ACCOUNT
  - AUTOMATIC_CONTACT_WITH_FAMILY
  - CHANGE_TRANSACTION_LIMIT
baseline_core_rules_apply_equally_to_all_ages: true
logging:
  store_dob_in_risk_logs: false
  store_age_profile_and_policy_version: true
  store_base_and_final_action: true
  store_independent_signal_groups: true
monitoring:
  metrics:
    - step_up_rate_by_age_and_core_risk
    - false_positive_rate_by_age_and_core_risk
    - completed_transfer_rate_by_age_and_core_risk
    - complaint_rate_by_age_and_core_risk
    - accessibility_error_rate
  boundaries_to_review: [60, 65, 70, 80]
